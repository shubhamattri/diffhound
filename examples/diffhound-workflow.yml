# Copy into the consumer repository's .github/workflows/diffhound.yml.
# All publishing uses the existing reviewer's token. Keep synchronize enabled.
name: Diffhound
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  review:
    if: github.event_name == 'pull_request'
    uses: shubhamattri/diffhound/.github/workflows/review.yml@main
    secrets: inherit
  commands:
    if: github.event_name == 'issue_comment'
    uses: shubhamattri/diffhound/.github/workflows/commands.yml@main
    secrets: inherit
